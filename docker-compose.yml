services:
  # ── 1. MongoDB Database ──
  mongodb:
    image: mongo:7.0
    container_name: islah-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: islah_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - islah-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Backend REST API Service ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: islah-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/islah_db
      - CLIENT_URL=http://localhost:3000
      - CMS_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET:-islah_welfare_super_secret_admin_jwt_key_2026}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-ISLAH Welfare Foundation <info@iwfindia.org>}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL:-info@iwfindia.org}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_TmuAaMXKT1eeAi}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - CLOUDFLARE_R2_PUBLIC_URL=https://pub-9df833ce82f4452db02dda1a3edca3d4.r2.dev
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - islah-network

  # ── 3. Public Web Client ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: islah-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - islah-network

  # ── 4. Admin & Media CMS ──
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: islah-cms
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - islah-network

volumes:
  mongodb_data:
    driver: local

networks:
  islah-network:
    driver: bridge
